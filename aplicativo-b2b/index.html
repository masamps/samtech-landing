            "name": "Quanto custa um aplicativo de pedidos para distribuidora?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "São dois caminhos. No App pronto, por R$ 2.000, entregamos o aplicativo com a sua marca e os pacotes prontos, e a publicação nas lojas fica com você. Na Gestão completa, a partir de R$ 12.000 mais R$ 700 por mês, cuidamos de tudo: marca, dados, publicação nas duas lojas e o aplicativo funcionando ao longo do tempo. Desenvolver um aplicativo assim do zero costuma custar muito mais e levar meses, porque aqui o produto já existe e está testado."
            }
          },
          {
            "@type": "Question",
            "name": "Como funciona um aplicativo de força de vendas B2B?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O seu cliente ou o seu representante entra no aplicativo com login próprio e vê o catálogo com foto, preço e estoque — já com a tabela de preço e a condição de pagamento cadastradas para aquele cliente. Ele monta o carrinho, revisa o pedido com impostos, escolhe transportadora e envia. O pedido chega no seu sistema sem ninguém precisar redigitar nada, a qualquer hora do dia."
            }
          },
          {
            "@type": "Question",
            "name": "O que é um aplicativo white label?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "É um aplicativo pronto que ganha a identidade de cada empresa. No nosso caso, cores, logo, ícone, tela de abertura e nome são os da sua empresa, e o aplicativo é publicado na Play Store e na App Store em nome dela. Para o seu cliente, o app é seu: a Samps Projetos não aparece em lugar nenhum."
            }
          },
          {
            "@type": "Question",
            "name": "Quem não é cliente consegue ver o catálogo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim, e isso é proposital. O visitante baixa o aplicativo e navega pelo catálogo livremente, mas no lugar do preço vê um convite para entrar. Se ele ainda não tem acesso, pede cadastro ali mesmo. Assim o aplicativo também trabalha como canal de captação: quem chegou por indicação ou pela loja de aplicativos consegue conhecer a linha de produtos antes de virar cliente, e você recebe o pedido de cadastro sem que ninguém precise atender."
            }
          },
          {
            "@type": "Question",
            "name": "Em quanto tempo o aplicativo entra no ar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "De 2 a 4 semanas na maioria dos casos. Aplicar a marca e gerar os pacotes é rápido, porque isso é automatizado. O que costuma pesar no prazo é a integração com o seu sistema e a análise das lojas, principalmente a da Apple, que pode pedir ajustes antes de aprovar."
            }
          },
          {
            "@type": "Question",
            "name": "Preciso já ter um sistema ou um ERP?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não precisa. Se a sua empresa já usa um ERP de mercado ou um sistema próprio, o aplicativo se liga a ele. Se você ainda controla produtos e preços em planilha ou caderno, montamos o sistema junto com o aplicativo — e isso funciona para loja pequena também. No diagnóstico avaliamos o seu caso e dizemos qual caminho sai mais barato."
            }
          },
          {
            "@type": "Question",
            "name": "Serve para representante comercial e venda externa?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Serve. O mesmo aplicativo funciona nos dois sentidos: o cliente comprando sozinho pelo celular, ou o representante tirando o pedido na frente do cliente durante a visita. Como o app aceita várias empresas ou filiais, um representante que atende mais de uma marca também é atendido."
            }
          },
          {
            "@type": "Question",
            "name": "Por que existe mensalidade se o aplicativo é meu?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Porque aplicativo publicado não é software parado. Apple e Google exigem atualizações técnicas todo ano e removem das lojas quem não acompanha. A mensalidade cobre essas atualizações obrigatórias, correções, republicação e suporte. Ela é opcional, mas sem ela o aplicativo tende a sair do ar com o tempo."
            }
          },
          {
            "@type": "Question",
            "name": "Minha loja é pequena. Vale a pena?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Vale se você vende para outras empresas e hoje recebe pedido por telefone, WhatsApp ou papel. O tamanho da loja não muda o problema: alguém do seu time gasta tempo anotando e redigitando pedido. Como o aplicativo já existe, o investimento é bem menor que desenvolver do zero, e conseguimos começar simples — só com o catálogo e o pedido — e crescer depois."
            }
          },

            "name": "Dá para adaptar o aplicativo ao meu processo?",
            "acceptedAnswer": {
              "@type": "Answer",

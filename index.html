    <!-- Structured Data: Organization + Services -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Samps Projetos",
        "image": "https://samps-projetos.vercel.app/og-image.svg",

          {
            "@type": "Offer",
            "itemOffered": {

    <!-- Structured Data: FAQ (pode gerar resultado enriquecido no Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Como funciona o diagnóstico gratuito?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "É uma conversa de cerca de 30 minutos, sem compromisso, para entender o seu processo e o que você precisa resolver. Ao final você recebe uma orientação do caminho e, se fizer sentido, uma proposta com escopo, prazo e valor."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto custa um projeto?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O valor depende do escopo: um site institucional tem investimento bem menor que um sistema com várias integrações. Depois do diagnóstico enviamos uma proposta fechada, com o preço definido antes de começar."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto tempo leva para ficar pronto?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Depende da complexidade. Um site institucional costuma levar de 2 a 4 semanas, enquanto sistemas e aplicativos mais robustos variam de 2 a 4 meses."
            }
          },
          {
            "@type": "Question",
            "name": "O sistema fica sob a minha propriedade?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Todo o código desenvolvido é seu, entregue pronto para crescer e sem amarras com a gente."
            }
          },
          {
            "@type": "Question",
            "name": "Vocês atendem empresas de outras cidades?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. O atendimento é remoto e acompanhamos o projeto por videochamada e WhatsApp, com contato direto com quem está desenvolvendo."
            }
          }
        ]
      }
    </script>

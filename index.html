    <!-- Structured Data: Organization + Services -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Samps Projetos",

        "address": {
          "@type": "PostalAddress",
          "addressLocality": "São Paulo",
          "addressRegion": "SP",
          "addressCountry": "BR"
        },
        "areaServed": [
          { "@type": "City", "name": "São Paulo" },
          { "@type": "Country", "name": "Brasil" }
        ],
        "priceRange": "$$",
        "knowsLanguage": ["pt-BR"],
        "slogan": "Sistemas sob medida para acabar com o trabalho manual da sua empresa.",
        "makesOffer": [
          {
            "@type": "Offer",
            "priceCurrency": "BRL",
            "price": "6000",
            "priceSpecification": {
              "@type": "PriceSpecification",
              "priceCurrency": "BRL",
              "minPrice": "6000"
            },
            "itemOffered": {
              "@type": "Service",
              "name": "Automação de Processos",
              "description": "Automação de tarefas manuais e repetitivas: conferência de documentos, leitura de PDFs e planilhas, relatórios e integrações."
            }
          },
          {
            "@type": "Offer",
            "priceCurrency": "BRL",
            "price": "15000",
            "priceSpecification": {
              "@type": "PriceSpecification",
              "priceCurrency": "BRL",
              "minPrice": "15000"
            },
            "itemOffered": {
              "@type": "Service",
              "name": "Desenvolvimento de Sistemas Web sob medida",
              "description": "Plataformas, painéis administrativos e sistemas de gestão desenvolvidos para o processo da empresa."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Sites e Aplicativos Mobile",
              "description": "Sites institucionais, landing pages otimizadas para SEO e aplicativos para Android e iOS."
            }
          }
        ]

    <!-- Structured Data: FAQ (pode gerar resultado enriquecido no Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Como funciona o diagnóstico gratuito?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "É uma conversa de cerca de 30 minutos, sem compromisso, para entender o seu processo e o que você precisa resolver. Ao final você recebe uma orientação do caminho e, se fizer sentido, uma proposta com escopo, prazo e valor."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto custa um projeto?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Automações de processo começam em R$ 6.000 e sistemas web sob medida em R$ 15.000. O valor final depende do escopo, principalmente da quantidade de integrações. Depois do diagnóstico você recebe uma proposta fechada, com o preço definido antes de começar."
            }
          },
          {
            "@type": "Question",
            "name": "Existe custo mensal depois da entrega?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Só se você quiser. A manutenção contínua começa em R$ 500/mês e inclui correções, melhorias e novas funcionalidades. Não é obrigatória: o sistema é seu e continua funcionando sem ela."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto tempo leva para ficar pronto?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Depende da complexidade. Um site institucional costuma levar de 2 a 4 semanas, enquanto sistemas e aplicativos mais robustos variam de 2 a 4 meses."
            }
          },
          {
            "@type": "Question",
            "name": "O sistema fica sob a minha propriedade?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Todo o código desenvolvido é seu, entregue pronto para crescer e sem amarras com a gente."
            }
          },
          {
            "@type": "Question",
            "name": "Vocês atendem empresas de outras cidades?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. O atendimento é remoto e acompanhamos o projeto por videochamada e WhatsApp, com contato direto com quem está desenvolvendo."
            }
          }
        ]
      }
    </script>
